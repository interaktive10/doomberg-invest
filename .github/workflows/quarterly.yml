name: quarterly
# BRIEF §2.1 "quarterly", §2.5: 13F holder counts -> ownership_q, then the universe rebuild from a fresh SEC listing.
# The weekly run applies the full universe rules (§1.3) every week. After the universe rebuild, the Signal Lab
# re-runs (§2.1, §11.8): this workflow dispatches lab.yml, which stays manual too (§4.10).
# First run: dispatch with windows=3, so S8 has two quarters of holder growth.
on:
  schedule:
    - cron: "0 3 20 1,4,7,10 *"
  workflow_dispatch:
    inputs:
      windows:
        description: "How many of the latest published 13F data sets to load"
        default: "1"

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      ready: ${{ steps.secrets.outputs.ready }}
    steps:
      - id: secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          if [ -n "$DATABASE_URL" ] && [ -n "$SEC_USER_AGENT" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::DATABASE_URL and SEC_USER_AGENT secrets are not set (BRIEF §2.4): nothing to do"; fi

  us:
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      DOOM_CACHE_DIR: ${{ github.workspace }}/.cache
      WINDOWS: ${{ github.event.inputs.windows || '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --no-dev
      - run: uv run --frozen python -m pipeline.db.migrate
      # 13F first: it maps CUSIPs against the universe the weekly run decided. The re-seed below puts every listed
      # filer back in until the next weekly run re-applies the rules (review F9 on M2).
      - name: 13F holder counts
        run: uv run --frozen python -m pipeline.us.quarterly --windows "$WINDOWS"
      - name: universe rebuild (fresh SEC listing on the runner; the committed NSE list stays)
        run: |
          uv run --frozen python scripts/fetch_fixtures.py universe --source sec
          uv run --frozen python -m pipeline.db.seed

  lab:
    # §2.1 "quarterly: ... Signal Lab re-run": a quarterly re-run of lab.yml once the universe is rebuilt (lab.yml
    # itself says BLOCKED(human) until the Stooq bulk file is attached to the lab-data-v1 release).
    needs: us
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write   # dispatches lab.yml; only this job's token can (M8 review R2 idea: least privilege)
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # --ref: without it gh looks up the default branch, which this token (actions: write only) can't read
      # ("Resource not accessible by integration", first live run 2026-09-29).
      - name: Signal Lab re-run
        run: gh workflow run lab.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f market=us

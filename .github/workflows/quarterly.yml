name: quarterly
# BRIEF §2.1 "quarterly", §2.5: 13F holder counts -> ownership_q, then the universe rebuild from a fresh SEC listing.
# The weekly run applies the full universe rules (§1.3) every week. The Signal Lab doesn't re-run here (overhaul PR 3,
# docs/SPEC_ISSUES.md 51): its prices are a one-time download (lab-prices.yml), and lab.yml stays manual.
# First run: dispatch with windows=3, so S8 has two quarters of holder growth.
on:
  schedule:
    - cron: "0 3 20 1,4,7,10 *"
  workflow_dispatch:
    inputs:
      windows:
        description: "How many of the latest published 13F data sets to load"
        default: "1"

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  us:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      DOOM_CACHE_DIR: ${{ github.workspace }}/.cache
      WINDOWS: ${{ github.event.inputs.windows || '1' }}
    steps:
      - name: Secrets (BRIEF §2.4; without them the steps below are skipped, with a notice)
        id: secrets
        run: |
          if [ -n "$DATABASE_URL" ] && [ -n "$SEC_USER_AGENT" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::DATABASE_URL and SEC_USER_AGENT secrets are not set (BRIEF §2.4): nothing to do"; fi
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ok == 'true'
      - uses: astral-sh/setup-uv@v6
        if: steps.secrets.outputs.ok == 'true'
        with:
          enable-cache: true
      - if: steps.secrets.outputs.ok == 'true'
        run: uv python install 3.12
      - if: steps.secrets.outputs.ok == 'true'
        run: uv sync --frozen --no-dev
      - if: steps.secrets.outputs.ok == 'true'
        run: uv run --frozen python -m pipeline.db.migrate
      # 13F first: it maps CUSIPs against the universe the weekly run decided. The re-seed below puts every listed
      # filer back in until the next weekly run re-applies the rules (review F9 on M2).
      - name: 13F holder counts
        if: steps.secrets.outputs.ok == 'true'
        run: uv run --frozen python -m pipeline.us.quarterly --windows "$WINDOWS"
      - name: universe rebuild (fresh SEC listing on the runner; the committed NSE list stays)
        if: steps.secrets.outputs.ok == 'true'
        run: |
          uv run --frozen python scripts/fetch_fixtures.py universe --source sec
          uv run --frozen python -m pipeline.db.seed

name: thesis-ingest
# BRIEF §4.9 step 3, §2.5 (<= 3 min): on a push touching data/thesis_cards/** (the Sunday routine pushes its branch,
# Appendix G), open the pushed weeks' sealed cards and main's sealed queue with THESIS_VAULT_KEY (the repository is
# public; pipeline/thesis/vault.py, SPEC_ISSUES 60), validate the cards again and upsert them into `theses` (state
# research, author routine) with their kill criteria. With the free LLM keys, P-05 re-checks the sentences without
# numbers. The push supplies cards only (M6 review R1-F4): the job runs main's code against main's queue files, takes
# only data/thesis_cards/** from the pushed commit, and ingests nothing when the push changed any other path or
# carries a plaintext card. The log names no card (a card's file name names its company).
on:
  push:
    paths:
      - "data/thesis_cards/**"

concurrency:
  group: thesis-ingest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      THESIS_VAULT_KEY: ${{ secrets.THESIS_VAULT_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}  # main's code and main's queue files
          fetch-depth: 0
      - name: The pushed cards (data/thesis_cards/** only) and the paths the push changed
        env:
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --no-tags origin "$SHA"
          if [ "$GITHUB_REF" = "refs/heads/$DEFAULT" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            git diff --name-only "$BEFORE" "$SHA" > "$RUNNER_TEMP/changed.txt"
          else
            git diff --name-only "origin/$DEFAULT...$SHA" > "$RUNNER_TEMP/changed.txt"
          fi
          git checkout "$SHA" -- data/thesis_cards
          grep -Ev '^data/thesis_cards/.+/' "$RUNNER_TEMP/changed.txt" || true
          echo "$(grep -Ec '^data/thesis_cards/.+/' "$RUNNER_TEMP/changed.txt" || true) path(s) inside a week folder (not named here: the log is public)"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --no-dev
      - name: Database secret
        id: db
        run: |
          if [ -n "$DATABASE_URL" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::the DATABASE_URL secret is not set (BRIEF §2.4): nothing to ingest"; fi
      - if: steps.db.outputs.ok == 'true'
        run: uv run --frozen python -m pipeline.db.migrate
      - name: Validate and ingest the pushed cards
        if: steps.db.outputs.ok == 'true'
        run: uv run --frozen python -m pipeline.thesis.ingest --changed "$RUNNER_TEMP/changed.txt"

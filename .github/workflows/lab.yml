name: lab
# BRIEF §4.10 Signal Lab (US first): the month-end prices lab-prices.yml downloaded from Twelve Data (the `lab-data-v1`
# release; docs/SPEC_ISSUES.md 51) -> the point-in-time monthly panel -> events and statistics -> lab_results,
# docs/LAB_REPORT.md and the §4.10.5 weight proposals. lab-prices.yml dispatches the first run once its download is
# complete; later runs are manual (there is no quarterly re-run). The Actions minutes gate goes first. The panel is kept
# as a release asset (§2.8) as soon as it is built, also when a later step fails. Two PRs: the report, and
# config/weights.yaml alone (a protected path: it passes the `protected` check only with the human-approved label),
# whose body gives each signal's verdict. PRs opened with the workflow token start no CI run: close and reopen them to
# run the checks.
on:
  workflow_dispatch:
    inputs:
      market:
        description: "Market (India only once config/lab.yaml enables it, §4.10.7)"
        type: choice
        options: [us, in]
        default: us

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: read   # the minutes gate reads this repository's runs (pipeline/digest/minutes.py)

jobs:
  lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 180   # 60-180 minutes on the 2-core runner (SPEC_ISSUES 51); the gate reserves all of it
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GH_TOKEN: ${{ github.token }}
      MARKET: ${{ inputs.market }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --no-dev
      - name: Actions minutes gate (this run may take its whole limit; a refusal is a notice)
        id: gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run --frozen python -m pipeline.digest.minutes gate --need 180
      - name: The Lab's prices and the download's state (the lab-data-v1 release)
        id: prices
        if: steps.gate.outputs.allowed == 'true'
        run: |
          mkdir -p .cache/lab
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice::the DATABASE_URL secret is not set (BRIEF §2.4): nothing to do"
          elif gh release download lab-data-v1 --pattern 'us_month_prices.csv.gz' --pattern 'us_prices_state.json' --dir .cache/lab --clobber; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::no Lab prices in the lab-data-v1 release yet: lab-prices.yml downloads them from Twelve Data"
          fi
      - name: Migrations
        if: steps.prices.outputs.ok == 'true'
        run: uv run --frozen python -m pipeline.db.migrate
      - name: Lab run (blocked, exit 3, until the download is complete)
        if: steps.prices.outputs.ok == 'true'
        run: uv run --frozen python -m pipeline.lab.run --market "$MARKET" --workers 2 --propose --pr-body "$RUNNER_TEMP/weights_pr.md"
      - name: Keep the panel (release asset; written as soon as it is built)
        if: always() && steps.prices.outputs.ok == 'true' && hashFiles('.cache/lab/panel.parquet') != ''
        run: gh release upload lab-data-v1 .cache/lab/panel.parquet --clobber
      - name: Open the report PR and the weights PR
        if: steps.prices.outputs.ok == 'true'
        run: |
          git config user.name "doomberg-lab"
          git config user.email "doomberg-lab@users.noreply.github.com"
          stamp="$(date -u +%Y%m%d)-${GITHUB_RUN_ID}"
          cp docs/LAB_REPORT.md "$RUNNER_TEMP/report.md"
          cp config/weights.yaml "$RUNNER_TEMP/weights.yaml"
          git checkout -- docs/LAB_REPORT.md config/weights.yaml
          git switch -c "lab/report-$stamp" "$GITHUB_SHA"
          cp "$RUNNER_TEMP/report.md" docs/LAB_REPORT.md
          git add docs/LAB_REPORT.md
          git commit -m "[Lab] Report $stamp ($MARKET)"
          git push -u origin HEAD
          gh pr create --title "[Lab] Report $stamp ($MARKET)" \
            --body "Signal Lab report from run ${GITHUB_RUN_ID} (BRIEF §4.10.6). Statistics are also in lab_results."
          git switch -c "lab/weights-$stamp" "$GITHUB_SHA"
          cp "$RUNNER_TEMP/weights.yaml" config/weights.yaml
          if git diff --quiet -- config/weights.yaml; then
            echo "no weight change proposed"
          else
            git add config/weights.yaml
            git commit -m "[Lab] Weight proposals $stamp ($MARKET)"
            git push -u origin HEAD
            gh pr create --title "[Lab] Weight proposals $stamp ($MARKET)" --body-file "$RUNNER_TEMP/weights_pr.md"
          fi

name: universe
# Fetches the universe snapshots (BRIEF §1.3, §8 M0-05) on a GitHub runner and commits them to the branch.
# Why here and not in a Claude cloud session: SEC throttles the shared egress IP of cloud sessions (HTTP 429
# "Request Rate Threshold Exceeded"); runners get a clean IP. NSE often blocks cloud runners instead, so the NSE
# list can be fetched either here (source: all) or from a session and committed (source: sec).
on:
  workflow_dispatch:
    inputs:
      source:
        description: "all | sec | nse"
        default: all
  push:
    branches-ignore: [main]
    paths: [.github/workflows/universe.yml]

concurrency:
  group: universe-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      SOURCE: ${{ github.event.inputs.source || 'sec' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: fetch snapshots
        run: |
          if [ -z "$SEC_USER_AGENT" ]; then
            echo "::error::Add the SEC_USER_AGENT repository secret (BRIEF §2.4), e.g. 'Doomberg personal research you@example.com'"
            exit 1
          fi
          uv run --frozen python scripts/fetch_fixtures.py universe --source "$SOURCE"
      - name: resolve capex seed
        run: uv run --frozen python scripts/resolve_capex_seed.py --write
      - name: M0-05 counts
        run: uv run --frozen pytest -q -p no:cacheprovider tests/test_universe.py -m snapshots
      - name: commit snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/universe config/capex_seed.yaml docs/UNIVERSE_ISSUES.md
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "[M0] Universe snapshots (fetched by the universe workflow)"
          git push origin "HEAD:${GITHUB_REF_NAME}"

name: connection-check
# One-off check that the repository secrets work (Manzoor's request, 2026-09-29). Read-only and free:
# - DATABASE_URL: connects and reads the server version; writes nothing.
# - SEC_USER_AGENT: one request to SEC's public ticker file.
# - GEMINI_API_KEY: one tiny free-tier request ("reply OK").
# Prints only pass/fail, status codes and non-secret details; GitHub also masks secret values in logs.
on:
  push:
    branches: [connection-check]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: secrets present
        run: |
          for s in DATABASE_URL SEC_USER_AGENT GEMINI_API_KEY; do
            if [ -n "${!s}" ]; then echo "PASS $s is set"; else echo "FAIL $s is empty or missing"; fi
          done

      - name: database (DATABASE_URL)
        if: always()
        run: |
          host=$(python3 -c "import os,urllib.parse as u; p=u.urlsplit(os.environ['DATABASE_URL']); print(p.hostname or '?', p.port or 5432)")
          echo "host and port: $host (a Session pooler address ends in pooler.supabase.com, port 5432)"
          set +e
          out=$(PGCONNECT_TIMEOUT=15 psql "$DATABASE_URL" -X -A -t -v ON_ERROR_STOP=1 -c "select current_user, current_database(), split_part(version(), ' ', 2), (select count(*) from information_schema.tables where table_schema = 'public')" 2>&1)
          code=$?
          set -e
          if [ $code -eq 0 ]; then echo "PASS connected: user|db|postgres version|public tables = $out"; exit 0; fi
          # never echo the connection string: strip every piece of it (split at : / @ ?) from the error first
          OUT="$out" python3 - <<'PY'
          import os, re
          url, out = os.environ["DATABASE_URL"], os.environ["OUT"]
          for piece in sorted(set(re.split(r"[:/@?=&]+", url)), key=len, reverse=True):
              if len(piece) >= 3 and piece not in ("postgresql", "postgres", "5432", "6543"):
                  out = out.replace(piece, "<hidden>")
          kind = ("the password or connection string has an unescaped special character (@ : / ?)" if "translate host name" in out
                  else "network unreachable: the Direct connection is IPv6-only; use the Session pooler" if "unreachable" in out.lower()
                  else "wrong password" if "password authentication failed" in out
                  else "timed out" if "timeout" in out.lower() else "other")
          print(f"FAIL could not connect ({kind}): {out}")
          PY
          exit 1

      - name: database via the Session pooler (derived from DATABASE_URL)
        if: always()
        run: |
          python3 - <<'PY'
          import os, re, subprocess, urllib.parse as u
          url = os.environ["DATABASE_URL"]
          p = u.urlsplit(url)
          host = p.hostname or ""
          if host.endswith(".pooler.supabase.com"):
              print("DATABASE_URL already uses the pooler:", host); raise SystemExit(0)
          m = re.fullmatch(r"db\.([a-z0-9]+)\.supabase\.co", host)
          if not m:
              print("not a Supabase direct-connection host; nothing to derive"); raise SystemExit(0)
          ref, pw = m.group(1), u.unquote(p.password or "")
          def scrub(s):
              return s.replace(pw, "<hidden>") if pw else s
          regions = ["us-east-1", "us-east-2", "us-west-1", "us-west-2", "ca-central-1", "sa-east-1", "eu-west-1",
                     "eu-west-2", "eu-west-3", "eu-central-1", "eu-central-2", "eu-north-1", "ap-south-1",
                     "ap-southeast-1", "ap-southeast-2", "ap-northeast-1", "ap-northeast-2"]
          for prefix in ("aws-0", "aws-1"):
              for region in regions:
                  h = f"{prefix}-{region}.pooler.supabase.com"
                  cand = f"postgresql://postgres.{ref}:{u.quote(pw, safe='')}@{h}:5432/postgres"
                  r = subprocess.run(["psql", cand, "-X", "-A", "-t", "-c", "select version()"], capture_output=True, text=True,
                                     env={**os.environ, "PGCONNECT_TIMEOUT": "8"})
                  if r.returncode == 0:
                      print(f"PASS the Session pooler answers at {h}:5432 as user postgres.{ref}: {r.stdout.strip()[:60]}")
                      raise SystemExit(0)
                  print(f"  not {h}: {scrub(r.stderr.strip().splitlines()[-1] if r.stderr.strip() else '?')[:90]}")
          print("FAIL no pooler host accepted the connection"); raise SystemExit(1)
          PY

      - name: SEC (SEC_USER_AGENT)
        if: always()
        run: |
          case "$SEC_USER_AGENT" in *@*.*) echo "PASS the user agent contains an email address";; *) echo "FAIL the user agent has no email address (SEC requires one)";; esac
          code=$(curl -s -o /tmp/tickers.json -w "%{http_code}" -H "User-Agent: $SEC_USER_AGENT" https://www.sec.gov/files/company_tickers.json)
          if [ "$code" = "200" ]; then echo "PASS SEC answered 200 ($(python3 -c "import json; print(len(json.load(open('/tmp/tickers.json'))))") tickers)"; else echo "FAIL SEC answered HTTP $code"; exit 1; fi

      - name: Gemini (GEMINI_API_KEY)
        if: always()
        run: |
          set +e
          code=$(curl -s -o /tmp/models.json -w "%{http_code}" -H "x-goog-api-key: $GEMINI_API_KEY" \
            "https://generativelanguage.googleapis.com/v1beta/models?pageSize=200")
          if [ "$code" != "200" ]; then echo "FAIL listing models answered HTTP $code"; exit 1; fi
          echo "PASS the key is valid. Flash models this key can call (generateContent):"
          python3 - <<'PY'
          import json
          d = json.load(open("/tmp/models.json"))
          for m in d.get("models", []):
              if "flash" in m["name"] and "generateContent" in m.get("supportedGenerationMethods", []):
                  print("  ", m["name"].removeprefix("models/"))
          PY
          fail=0
          for model in gemini-2.5-flash-lite gemini-2.5-flash gemini-3.5-flash-lite gemini-3.5-flash; do
            code=$(curl -s -o /tmp/gemini.json -w "%{http_code}" -H "x-goog-api-key: $GEMINI_API_KEY" -H "Content-Type: application/json" \
              -d '{"contents":[{"parts":[{"text":"Reply with the single word OK."}]}]}' \
              "https://generativelanguage.googleapis.com/v1beta/models/$model:generateContent")
            if [ "$code" = "200" ]; then
              echo "PASS $model answered: $(python3 -c "import json; d=json.load(open('/tmp/gemini.json')); print(d['candidates'][0]['content']['parts'][0]['text'].strip()[:40])")"
            else
              echo "FAIL $model answered HTTP $code: $(python3 -c "import json; d=json.load(open('/tmp/gemini.json')); e=d.get('error',{}); print(e.get('status'), '-', str(e.get('message'))[:160])" 2>/dev/null)"
            fi
          done

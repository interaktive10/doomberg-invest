name: ci
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MOCK_EXTERNALS: "true"
      DATABASE_URL: postgresql://doom:doom@localhost:5432/doom
    services:
      postgres:            # BRIEF §2.2: PostgreSQL 16 for dev/test (Supabase in production)
        image: postgres:16
        env:
          POSTGRES_USER: doom
          POSTGRES_PASSWORD: doom
          POSTGRES_DB: doom
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U doom" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: make lint
      - run: make type
      - run: make guard
      - run: make test
      - name: verify (every milestone up to the latest that has checks)
        run: make verify-m1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-report
          path: docs/VERIFY_REPORT.md

  protected:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: protected paths need the human-approved label (BRIEF Appendix D)
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE_REF: ${{ github.base_ref }}
        run: python3 scripts/protected_check.py --base "origin/${BASE_REF}" --labels "${LABELS}"

name: ci
# Pull requests only: main gets no run after a merge (with the branch rule 'require branches to be up to date', the
# PR's last run tested the merged code), and a label change runs only protected.yml. verify-m8's M0-01 runs the whole
# offline suite, so there is no separate `make test`.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MOCK_EXTERNALS: "true"
      DATABASE_URL: postgresql://doom:doom@localhost:5432/doom
    services:
      postgres:            # BRIEF §2.2: PostgreSQL 16 for dev/test (Supabase in production)
        image: postgres:16
        env:
          POSTGRES_USER: doom
          POSTGRES_PASSWORD: doom
          POSTGRES_DB: doom
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U doom" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: make lint
      - run: make type
      - run: make guard
      - name: verify (every milestone up to the latest that has checks; M0-01 is the whole test suite)
        run: make verify-m8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-report
          path: docs/VERIFY_REPORT.md

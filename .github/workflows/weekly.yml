name: weekly
# BRIEF §2.1 "weekly", §2.5 (Saturday): SEC bulk companyfacts + submissions -> fundamentals_q and the US universe
# rules; India: securities + ASM/GSM -> universe, bhavcopy -> prices_w (NSE, else BSE, else imports/), results XBRL
# -> fundamentals_q, shareholding -> ownership_q. M4 adds signals -> red flags -> prices -> context -> scores; M5 the
# Capex Desk (demand index and memberships before scores, the Capex brief after); M6 kill criteria, evidence packs,
# the thesis queue (committed to main) and the digest issue.
# The bulk zips (a few GB) stay on the runner; only the per-company sha256 state is cached between weeks.
on:
  schedule:
    - cron: "0 2 * * 6"
  workflow_dispatch:
    inputs:
      force:
        description: "Re-quarterize every company (after a database restore; ignores the sha256 state)"
        type: boolean
        default: false

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      ready: ${{ steps.secrets.outputs.ready }}
      db: ${{ steps.secrets.outputs.db }}
    steps:
      - id: secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          if [ -n "$DATABASE_URL" ]; then echo "db=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::the DATABASE_URL secret is not set (BRIEF §2.4): nothing to do"; fi
          if [ -n "$DATABASE_URL" ] && [ -n "$SEC_USER_AGENT" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$DATABASE_URL" ]; then echo "::notice::SEC_USER_AGENT is not set: US jobs skipped"; fi

  us:
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    # A full quarterize (no companyfacts state: the first run, a cache miss, --force) took 53 minutes on 2026-09-29;
    # a timeout loses the state, so the next run would be full again. Incremental runs take a few minutes.
    timeout-minutes: 120
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      DOOM_CACHE_DIR: ${{ github.workspace }}/.cache
      FORCE: ${{ github.event.inputs.force == 'true' && '--force' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --no-dev
      - name: companyfacts state (sha256 + TTM revenue per company)
        uses: actions/cache@v4
        with:
          path: .cache/us/companyfacts_state.json
          key: us-companyfacts-state-${{ github.run_id }}
          restore-keys: us-companyfacts-state-
      - run: uv run --frozen python -m pipeline.db.migrate
      - name: US fundamentals and universe
        run: uv run --frozen python -m pipeline.us.weekly $FORCE
      - name: data issues (every §4.1.5 null reason)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-data-issues
          path: .cache/us/issues.csv
          if-no-files-found: ignore

  india:
    needs: check
    if: needs.check.outputs.db == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DOOM_CACHE_DIR: ${{ github.workspace }}/.cache
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --no-dev
      - name: India state (listing cursor, download queues, 3 years of results per company, last shareholding pattern)
        uses: actions/cache@v4
        with:
          path: .cache/in/weekly_state.json
          key: in-weekly-state-${{ github.run_id }}
          restore-keys: in-weekly-state-
      - run: uv run --frozen python -m pipeline.db.migrate
      - name: India universe, prices, results and shareholding
        run: uv run --frozen python -m pipeline.india.weekly

  capex:
    # M5 (BRIEF §4.11): EIA planned additions, the demand index per category (point in time, from verified facts)
    # and membership proposals (US by the industry map; India by P-06 with grounded quotes). Before scores, so S11
    # reads this week's index; if it fails, scores still run on the last one.
    needs: [check, us, india]
    if: always() && needs.check.outputs.db == 'true' && (needs.us.result == 'success' || needs.india.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      DOOM_CACHE_DIR: ${{ github.workspace }}/.cache
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --no-dev
      - run: uv run --frozen python -m pipeline.db.migrate
      - name: Capex Desk demand index and memberships
        run: uv run --frozen python -m pipeline.capex.run --stage index

  scores:
    # M4 (BRIEF §2.1): signals -> red flags -> Evidence -> candidate prices (Yahoo) -> context C1-C4 -> Gap ->
    # buckets -> shortlist. Runs after both markets' data; if one market's job failed, the other is still scored.
    needs: [check, us, india, capex]
    if: always() && needs.check.outputs.db == 'true' && (needs.us.result == 'success' || needs.india.result == 'success')
    runs-on: ubuntu-latest
    # One transaction: a run cut off by the limit keeps nothing. Prices are up to 400 downloads 1 s apart, GDELT
    # 100 queries 5 s apart; the first live run (2026-09-29) spent 40 minutes without finishing.
    timeout-minutes: 90
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DOOM_CACHE_DIR: ${{ github.workspace }}/.cache
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --no-dev
      - run: uv run --frozen python -m pipeline.db.migrate
      - name: Signals, red flags, candidate prices, context, scores and the shortlist
        run: uv run --frozen python -m pipeline.signals.weekly

  capex_brief:
    # M5 (BRIEF §4.11): the weekly Capex brief (index moves, material new facts, links, memberships, S11 companies)
    # for the digest, after this week's scores.
    needs: [check, scores]
    if: always() && needs.check.outputs.db == 'true' && needs.scores.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --no-dev
      - run: uv run --frozen python -m pipeline.db.migrate
      - name: Capex brief
        run: uv run --frozen python -m pipeline.capex.run --stage brief

  thesis:
    # M6 (BRIEF §4.9): kill criteria on the week's new rows -> evidence packs -> the thesis queue file, committed to main
    # for the Sunday routine (Appendix G). The queue is committed only from main, staging data/thesis_queue/ alone, on
    # top of a freshly fetched origin/main (rebased and retried if main moved; M6 review R1-F5).
    needs: [check, scores, capex_brief]
    if: always() && needs.check.outputs.db == 'true' && needs.scores.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # the queue commit
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DOOM_CACHE_DIR: ${{ github.workspace }}/.cache
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --no-dev
      - run: uv run --frozen python -m pipeline.db.migrate
      - name: Kill criteria (theses whose company got new rows this week)
        run: uv run --frozen python -m pipeline.thesis.kill_criteria
      - name: Evidence packs -> data/thesis_queue/<week>.json
        run: uv run --frozen python -m pipeline.thesis.queue
      - name: Commit the queue to main (Actions bot; from main only)
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/thesis_queue
          if git diff --cached --quiet -- data/thesis_queue; then
            echo "the queue file is unchanged"; exit 0
          fi
          git commit -m "Thesis queue $(date -u +%G-W%V)" -- data/thesis_queue
          for attempt in 1 2 3; do
            git fetch --no-tags origin main
            git rebase --autostash origin/main || { git rebase --abort; exit 1; }
            if git push origin HEAD:refs/heads/main; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1

  digest:
    # BRIEF §4.12: the weekly digest issue, every week: also when the scores or the queue commit failed, since those
    # are the weeks source health matters (M6 review R1-F6). It lists this week's triggered criteria, the Capex brief,
    # source health with the §2.7 staleness banner, LLM quota use, and says when the candidates are missing.
    needs: [check, scores, capex_brief, thesis]
    if: always() && needs.check.outputs.db == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write     # the digest issue
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GITHUB_TOKEN: ${{ github.token }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --no-dev
      - run: uv run --frozen python -m pipeline.db.migrate
      - name: Digest issue
        run: uv run --frozen python -m pipeline.digest.weekly

  size_guard:
    # BRIEF §2.8: after every job that writes, prune (signal_values past 3 years, NSE announcements past 120 days) and
    # fail the weekly run above 400 MB. Runs when a writer failed too (review R2-F1 on M3).
    needs: [check, us, india, capex, scores, capex_brief, thesis, digest]
    if: always() && needs.check.outputs.db == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --no-dev
      - run: uv run --frozen python -m pipeline.db.migrate
      - name: Storage guard (prune, then fail above 400 MB)
        run: uv run --frozen python -m pipeline.db.size_guard

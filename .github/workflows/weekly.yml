name: weekly
# BRIEF §2.1 "weekly", §2.5 (Saturday): SEC bulk companyfacts + submissions -> fundamentals_q and the US universe
# rules. M4 adds signals -> red flags -> prices -> context -> scores; M6 kill criteria, evidence packs, the thesis queue
# (committed to main) and the digest issue. India runs again (docs/SPEC_ISSUES.md 55; paused Oct 20-28, 46) and is
# scored with the US in one run. The Capex Desk and S11 are deleted (docs/SPEC_ISSUES.md 52).
# Jobs: us, india -> scores (only when us ran and succeeded; India's rows are scored with whatever its job stored) ->
# publish (every week; the queue only after this week's scores). The bulk zips (a few GB) stay on the runner; only the
# per-company sha256 state is cached between weeks. India's state lives in the database (pipeline.db.state).
on:
  schedule:
    - cron: "7 2 * * 6"   # off the hour: GitHub delays or drops scheduled runs at :00 under load
  workflow_dispatch:
    inputs:
      force:
        description: "Re-quarterize every company (after a database restore; ignores the sha256 state)"
        type: boolean
        default: false

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  us:
    runs-on: ubuntu-24.04
    # A full quarterize (no companyfacts state: the first run, a cache miss, --force) took 53 minutes on 2026-09-29;
    # a timeout loses the state, so the next run would be full again. Incremental runs take a few minutes.
    timeout-minutes: 120
    outputs:
      ran: ${{ steps.secrets.outputs.ok }}   # scores need this week's US data, not a run that skipped its steps
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      DOOM_CACHE_DIR: ${{ github.workspace }}/.cache
      FORCE: ${{ github.event.inputs.force == 'true' && '--force' || '' }}
    steps:
      - name: Secrets (BRIEF §2.4; without them the steps below are skipped, with a notice)
        id: secrets
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::notice::the DATABASE_URL secret is not set (BRIEF §2.4): nothing to do"
          elif [ -z "$SEC_USER_AGENT" ]; then echo "::notice::SEC_USER_AGENT is not set: the US run and scores are skipped"
          else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ok == 'true'
      - uses: astral-sh/setup-uv@v6
        if: steps.secrets.outputs.ok == 'true'
        with:
          enable-cache: true
      - if: steps.secrets.outputs.ok == 'true'
        run: uv python install 3.12
      - if: steps.secrets.outputs.ok == 'true'
        run: uv sync --frozen --no-dev
      - name: companyfacts state (sha256 + TTM revenue per company)
        if: steps.secrets.outputs.ok == 'true'
        uses: actions/cache@v4
        with:
          path: .cache/us/companyfacts_state.json
          key: us-companyfacts-state-${{ github.run_id }}
          restore-keys: us-companyfacts-state-
      - if: steps.secrets.outputs.ok == 'true'
        run: uv run --frozen python -m pipeline.db.migrate
      - name: US fundamentals and universe
        if: steps.secrets.outputs.ok == 'true'
        run: uv run --frozen python -m pipeline.us.weekly $FORCE
      - name: data issues (every §4.1.5 null reason)
        if: always() && steps.secrets.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: us-data-issues
          path: .cache/us/issues.csv
          if-no-files-found: ignore

  india:
    # BRIEF §4.3: the NSE securities and surveillance lists, the week's bhavcopy prices (BSE, then a manual CSV, when
    # NSE fails), new results XBRL and shareholding patterns. NSE allows one request every 3 s, so downloads are capped
    # per run and the rest waits in the state (listing cursors, queues, each company's parsed results history), kept
    # in the database: the Actions cache lost it in the pause (docs/SPEC_ISSUES.md 55). The `nse` group keeps every NSE
    # job (this one, daily's and india-backfill.yml) one at a time.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    concurrency:
      group: nse
      cancel-in-progress: false
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DOOM_CACHE_DIR: ${{ github.workspace }}/.cache
    steps:
      - name: Secrets (BRIEF §2.4; without them the steps below are skipped, with a notice)
        id: secrets
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::notice::the DATABASE_URL secret is not set (BRIEF §2.4): nothing to do"
          else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ok == 'true'
      - uses: astral-sh/setup-uv@v6
        if: steps.secrets.outputs.ok == 'true'
        with:
          enable-cache: true
      - if: steps.secrets.outputs.ok == 'true'
        run: uv python install 3.12
      - if: steps.secrets.outputs.ok == 'true'
        run: uv sync --frozen --no-dev
      - if: steps.secrets.outputs.ok == 'true'
        run: uv run --frozen python -m pipeline.db.migrate
      - name: India state (from the database)
        if: steps.secrets.outputs.ok == 'true'
        run: uv run --frozen python -m pipeline.db.state get in_weekly=.cache/in/weekly_state.json
      - name: India universe, prices, results and shareholding
        if: steps.secrets.outputs.ok == 'true'
        run: uv run --frozen python -m pipeline.india.weekly --minutes 75 --max-fetch 1400
      - name: Keep the India state (also after a failure)
        if: always() && steps.secrets.outputs.ok == 'true'
        run: uv run --frozen python -m pipeline.db.state put in_weekly=.cache/in/weekly_state.json

  scores:
    # M4 (BRIEF §2.1): signals -> red flags -> Evidence -> candidate prices (Twelve Data) -> context C1-C3 -> Gap ->
    # buckets -> shortlist, both markets in one run (a run replaces the week's rows of the markets it scores). Only on
    # this week's US data: when `us` failed or skipped its steps there are no scores this week, and the digest says so.
    # India is scored on what its job stored, also when that job failed (stale fundamentals don't count:
    # signals.weekly.fresh).
    needs: [us, india]
    if: ${{ !cancelled() && needs.us.result == 'success' && needs.us.outputs.ran == 'true' }}
    runs-on: ubuntu-24.04
    # One transaction: a run cut off by the limit keeps nothing. Prices are up to 400 downloads 8 s apart (Twelve
    # Data's free 8 a minute: under an hour); the first live run (2026-09-29) spent 40 minutes without finishing.
    timeout-minutes: 90
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
      DOOM_CACHE_DIR: ${{ github.workspace }}/.cache
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --no-dev
      - run: uv run --frozen python -m pipeline.db.migrate
      - name: Signals, red flags, candidate prices, context, scores and the shortlist (US and India)
        run: uv run --frozen python -m pipeline.signals.weekly

  publish:
    # Every week, whatever us and scores did, in one job (one runner start instead of three):
    # - M6 (BRIEF §4.9): kill criteria on the week's new rows -> evidence packs -> the thesis queue file, sealed with
    #   THESIS_VAULT_KEY (the repository is public; pipeline/thesis/vault.py, SPEC_ISSUES 60) and committed to main
    #   for the Sunday routine (Appendix G); only after this week's scores. The sealed queue is committed only from
    #   main, staging data/thesis_queue/ alone (the plaintext is gitignored and refused), on top of a freshly fetched
    #   origin/main (rebased and retried if main moved; M6 review R1-F5). Without the key nothing is committed and the
    #   week's cards come from Monday's fallback.
    # - BRIEF §4.12: the digest issue, also when scores or the queue commit failed, since those are the weeks source
    #   health matters (M6 review R1-F6). It has the funnel, To do, What changed and a health line naming the late
    #   sources with the Actions minutes line (overhaul PR 5), and says why the candidates are missing in a week
    #   without scores.
    # - BRIEF §2.8: the storage guard, after every job that writes and also when one failed (review R2-F1 on M3):
    #   prune (signal_values past 3 years, NSE announcements past 120 days) and fail the run above 400 MB.
    # Each work step has its own limit: a hung step fails alone and the digest and the guard still run (a job timeout
    # cancels the job, and !cancelled() steps with it). Env is set per step, only where a step reads it.
    needs: [us, india, scores]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write   # the queue commit
      issues: write     # the digest issue
      actions: read     # the digest's Actions minutes line reads this repository's runs (pipeline/digest/minutes.py)
    steps:
      - name: Secrets (BRIEF §2.4; without the database the steps below are skipped, with a notice)
        id: secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "$DATABASE_URL" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::the DATABASE_URL secret is not set (BRIEF §2.4): nothing to do"; fi
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ok == 'true'
      - uses: astral-sh/setup-uv@v6
        if: steps.secrets.outputs.ok == 'true'
        with:
          enable-cache: true
      - if: steps.secrets.outputs.ok == 'true'
        run: uv python install 3.12
      - if: steps.secrets.outputs.ok == 'true'
        run: uv sync --frozen --no-dev
      - if: steps.secrets.outputs.ok == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run --frozen python -m pipeline.db.migrate
      - name: Kill criteria (theses whose company got new rows this week)
        if: needs.scores.result == 'success'
        timeout-minutes: 5
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run --frozen python -m pipeline.thesis.kill_criteria
      - name: Evidence packs -> data/thesis_queue/<week>.sealed
        if: needs.scores.result == 'success'
        timeout-minutes: 5
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          THESIS_VAULT_KEY: ${{ secrets.THESIS_VAULT_KEY }}
        run: uv run --frozen python -m pipeline.thesis.queue
      - name: Commit the sealed queue to main (Actions bot; from main only)
        if: needs.scores.result == 'success' && github.ref == 'refs/heads/main'
        timeout-minutes: 3
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/thesis_queue
          if git diff --cached --name-only -- data/thesis_queue | grep -v '\.sealed$'; then
            echo "::error::only a sealed queue may be committed: the repository is public (SPEC_ISSUES 60)"; exit 1
          fi
          if git diff --cached --quiet -- data/thesis_queue; then
            echo "the sealed queue is unchanged or was not written"; exit 0
          fi
          git commit -m "Thesis queue $(date -u +%G-W%V)" -- data/thesis_queue
          for attempt in 1 2 3; do
            git fetch --no-tags origin main
            git rebase --autostash origin/main || { git rebase --abort; exit 1; }
            if git push origin HEAD:refs/heads/main; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1
      - name: Digest issue
        if: ${{ !cancelled() && steps.secrets.outputs.ok == 'true' }}
        timeout-minutes: 5
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_TOKEN: ${{ github.token }}
          # the digest's company links; the deployed app unless the APP_URL repository variable says otherwise
          APP_URL: ${{ vars.APP_URL || 'https://doomberg-invest.vercel.app' }}
          # why a week has no scores (pipeline.digest.weekly.unscored_why)
          US_RESULT: ${{ needs.us.result }}
          US_RAN: ${{ needs.us.outputs.ran }}
          SCORES_RESULT: ${{ needs.scores.result }}
        run: uv run --frozen python -m pipeline.digest.weekly
      - name: Storage guard (prune, then fail above 400 MB)
        if: ${{ !cancelled() && steps.secrets.outputs.ok == 'true' }}
        timeout-minutes: 8
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run --frozen python -m pipeline.db.size_guard

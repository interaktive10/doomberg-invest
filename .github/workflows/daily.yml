name: daily
# BRIEF §2.1 "daily", §2.5: SEC events for the previous business day (Form 4 purchases, 8-K items 4.01 / 1.01 /
# 2.03, NT filings, spin-offs); then (M5) the text facts of live theses and the stage names through the free-tier LLM
# router (no document starts after 15 minutes, about 150 documents, so the job takes about 18-20 minutes:
# docs/SPEC_ISSUES.md 29, 50, 58).
# SEC then text in one job (one runner start and setup instead of a job each), and India's NSE announcements and
# insider-trading disclosures in a job of its own (docs/SPEC_ISSUES.md 55; paused Oct 20-28, 46).
# Also the Supabase keep-alive (§2.9): a free project pauses without activity.
on:
  schedule:
    - cron: "13 1 * * 2-6"   # off the hour: GitHub delays or drops scheduled runs at :00 under load
  workflow_dispatch:
    inputs:
      date:
        description: "One filing date YYYY-MM-DD (default: every published day not yet processed)"
        required: false

concurrency:
  group: pipeline            # one pipeline run at a time (BRIEF §2.5)
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  us:
    runs-on: ubuntu-24.04
    # A normal day takes the SEC step's few minutes and the text step's 15; the limit leaves room for a catch-up after
    # an outage (the SEC step reads every published day not yet processed).
    timeout-minutes: 40
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      DOOM_CACHE_DIR: ${{ github.workspace }}/.cache
      DAY: ${{ github.event.inputs.date }}
    steps:
      - name: Secrets (BRIEF §2.4; without them the steps below are skipped, with a notice)
        id: secrets
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::notice::the DATABASE_URL secret is not set (BRIEF §2.4): nothing to do"
          elif [ -z "$SEC_USER_AGENT" ]; then echo "::notice::SEC_USER_AGENT is not set: the US run is skipped"
          else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ok == 'true'
      - uses: astral-sh/setup-uv@v6
        if: steps.secrets.outputs.ok == 'true'
        with:
          enable-cache: true
      - if: steps.secrets.outputs.ok == 'true'
        run: uv python install 3.12
      - if: steps.secrets.outputs.ok == 'true'
        run: uv sync --frozen --no-dev
      # Restored and saved by hand: actions/cache saves only when the whole job succeeds, so a failed or timed-out
      # text step would lose the SEC cursor. The save runs right after the SEC step, also when that step failed (it
      # keeps whatever state the step wrote; a day read twice inserts nothing new). The key carries the attempt, so a
      # re-run saves too.
      - name: daily state (last EDGAR day processed; Form 10 registrations not yet effective)
        if: steps.secrets.outputs.ok == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache/us/pending_form10.json
            .cache/us/daily_state.json
          key: us-daily-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: us-daily-state-
      - if: steps.secrets.outputs.ok == 'true'
        run: uv run --frozen python -m pipeline.db.migrate
      - name: SEC events
        if: steps.secrets.outputs.ok == 'true'
        run: uv run --frozen python -m pipeline.us.daily ${DAY:+--date "$DAY"}
      - name: save the daily state
        if: always() && steps.secrets.outputs.ok == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .cache/us/pending_form10.json
            .cache/us/daily_state.json
          key: us-daily-state-${{ github.run_id }}-${{ github.run_attempt }}
      # M5 (BRIEF §4.5, Appendix F): new 10-K/10-Q/8-K filings -> P-01 -> Verify-1 -> facts, diffs and counterparty
      # links. Without LLM keys or quotas (config/quotas.yaml) documents stay queued; nothing fails. Only after the
      # SEC step succeeded. The LLM keys are in this step's env alone.
      - name: Text facts, diffs and links (P-01, P-02)
        if: steps.secrets.outputs.ok == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: uv run --frozen python -m pipeline.facts.run --minutes 15 ${DAY:+--day "$DAY"}

  india:
    # BRIEF §4.3: NSE corporate announcements (corp_events; P-07's triage reads them the next morning) and promoter
    # trades from the insider-trading (PIT) disclosures. The state (cursors, disclosures read) lives in the database;
    # the `nse` group keeps every NSE job one at a time (india-backfill.yml's long runs avoid this hour).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: nse
      cancel-in-progress: false
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DOOM_CACHE_DIR: ${{ github.workspace }}/.cache
      DAY: ${{ github.event.inputs.date }}
    steps:
      - name: Secrets (BRIEF §2.4; without them the steps below are skipped, with a notice)
        id: secrets
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::notice::the DATABASE_URL secret is not set (BRIEF §2.4): nothing to do"
          else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ok == 'true'
      - uses: astral-sh/setup-uv@v6
        if: steps.secrets.outputs.ok == 'true'
        with:
          enable-cache: true
      - if: steps.secrets.outputs.ok == 'true'
        run: uv python install 3.12
      - if: steps.secrets.outputs.ok == 'true'
        run: uv sync --frozen --no-dev
      - if: steps.secrets.outputs.ok == 'true'
        run: uv run --frozen python -m pipeline.db.migrate
      - name: India daily state (from the database)
        if: steps.secrets.outputs.ok == 'true'
        run: uv run --frozen python -m pipeline.db.state get in_daily=.cache/in/daily_state.json
      - name: NSE announcements and insider trading
        if: steps.secrets.outputs.ok == 'true'
        run: uv run --frozen python -m pipeline.india.daily ${DAY:+--date "$DAY"}
      - name: Keep the India daily state (also after a failure)
        if: always() && steps.secrets.outputs.ok == 'true'
        run: uv run --frozen python -m pipeline.db.state put in_daily=.cache/in/daily_state.json

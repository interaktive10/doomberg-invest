name: daily
# BRIEF §2.1 "daily", §2.5: SEC events for the previous business day (Form 4 purchases, 8-K items 4.01 / 1.01 /
# 2.03, NT filings, spin-offs). M3 adds NSE/BSE announcements; M5 adds capex-desk text extraction.
# Also the Supabase keep-alive (§2.9): a free project pauses without activity.
on:
  schedule:
    - cron: "30 1 * * 2-6"
  workflow_dispatch:
    inputs:
      date:
        description: "One filing date YYYY-MM-DD (default: every published day not yet processed)"
        required: false

concurrency:
  group: pipeline            # one pipeline run at a time (BRIEF §2.5)
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      ready: ${{ steps.secrets.outputs.ready }}
    steps:
      - id: secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          if [ -n "$DATABASE_URL" ] && [ -n "$SEC_USER_AGENT" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::DATABASE_URL and SEC_USER_AGENT secrets are not set (BRIEF §2.4): nothing to do"; fi

  us:
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      DOOM_CACHE_DIR: ${{ github.workspace }}/.cache
      DAY: ${{ github.event.inputs.date }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --no-dev
      - name: daily state (last EDGAR day processed; Form 10 registrations not yet effective)
        uses: actions/cache@v4
        with:
          path: |
            .cache/us/pending_form10.json
            .cache/us/daily_state.json
          key: us-daily-state-${{ github.run_id }}
          restore-keys: us-daily-state-
      - run: uv run --frozen python -m pipeline.db.migrate
      - name: SEC events
        run: uv run --frozen python -m pipeline.us.daily ${DAY:+--date "$DAY"}

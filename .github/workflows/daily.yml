name: daily
# BRIEF §2.1 "daily", §2.5: SEC events for the previous business day (Form 4 purchases, 8-K items 4.01 / 1.01 /
# 2.03, NT filings, spin-offs); then (M5) the text facts of the capex desk, the shortlist and live theses through the
# free-tier LLM router (no document starts after 4 minutes, so the run stays ~8 minutes: docs/SPEC_ISSUES.md 29).
# One job, SEC then text: one runner start (and one setup) instead of a job each. India is paused
# (docs/SPEC_ISSUES.md 46): no NSE step.
# Also the Supabase keep-alive (§2.9): a free project pauses without activity.
on:
  schedule:
    - cron: "13 1 * * 2-6"   # off the hour: GitHub delays or drops scheduled runs at :00 under load
  workflow_dispatch:
    inputs:
      date:
        description: "One filing date YYYY-MM-DD (default: every published day not yet processed)"
        required: false

concurrency:
  group: pipeline            # one pipeline run at a time (BRIEF §2.5)
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  us:
    runs-on: ubuntu-24.04
    # A normal day takes a few minutes; the limit leaves room for a catch-up after an outage (the SEC step reads every
    # published day not yet processed).
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      DOOM_CACHE_DIR: ${{ github.workspace }}/.cache
      DAY: ${{ github.event.inputs.date }}
    steps:
      - name: Secrets (BRIEF §2.4; without them the steps below are skipped, with a notice)
        id: secrets
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::notice::the DATABASE_URL secret is not set (BRIEF §2.4): nothing to do"
          elif [ -z "$SEC_USER_AGENT" ]; then echo "::notice::SEC_USER_AGENT is not set: the US run is skipped"
          else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ok == 'true'
      - uses: astral-sh/setup-uv@v6
        if: steps.secrets.outputs.ok == 'true'
        with:
          enable-cache: true
      - if: steps.secrets.outputs.ok == 'true'
        run: uv python install 3.12
      - if: steps.secrets.outputs.ok == 'true'
        run: uv sync --frozen --no-dev
      # Restored and saved by hand: actions/cache saves only when the whole job succeeds, so a failed or timed-out
      # text step would lose the SEC cursor. The save runs right after the SEC step, also when that step failed (it
      # keeps whatever state the step wrote; a day read twice inserts nothing new). The key carries the attempt, so a
      # re-run saves too.
      - name: daily state (last EDGAR day processed; Form 10 registrations not yet effective)
        if: steps.secrets.outputs.ok == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache/us/pending_form10.json
            .cache/us/daily_state.json
          key: us-daily-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: us-daily-state-
      - if: steps.secrets.outputs.ok == 'true'
        run: uv run --frozen python -m pipeline.db.migrate
      - name: SEC events
        if: steps.secrets.outputs.ok == 'true'
        run: uv run --frozen python -m pipeline.us.daily ${DAY:+--date "$DAY"}
      - name: save the daily state
        if: always() && steps.secrets.outputs.ok == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .cache/us/pending_form10.json
            .cache/us/daily_state.json
          key: us-daily-state-${{ github.run_id }}-${{ github.run_attempt }}
      # M5 (BRIEF §4.5, Appendix F): new 10-K/10-Q/8-K filings -> P-01 -> Verify-1 -> facts, diffs, risk-factor
      # changes and counterparty links. Without LLM keys or quotas (config/quotas.yaml) documents stay queued; nothing
      # fails. Only after the SEC step succeeded. The LLM keys are in this step's env alone.
      - name: Text facts, diffs and links (P-01, P-02, P-03)
        if: steps.secrets.outputs.ok == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: uv run --frozen python -m pipeline.facts.run --minutes 4 ${DAY:+--day "$DAY"}

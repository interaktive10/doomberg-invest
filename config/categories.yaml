# Capex Desk demand categories (BRIEF §1.10, §4.11). Direction thresholds in sigma.
direction: {rising_min_sigma: 0.5, falling_max_sigma: -0.5}
categories:
  compute: {inputs: [hyperscaler_capex_guidance]}
  networking: {inputs: [hyperscaler_capex_guidance]}
  optical: {inputs: [hyperscaler_capex_guidance]}
  power_equipment: {inputs: [utility_large_load_gw, eia_planned_additions_mw, lead_time_transformers, lead_time_turbines, lead_time_switchgear]}
  grid: {inputs: [utility_large_load_gw, lead_time_transformers, lead_time_switchgear]}
  cooling: {inputs: [hyperscaler_capex_guidance, utility_large_load_gw]}
  construction: {inputs: [hyperscaler_capex_guidance, utility_large_load_gw]}
  on_site_power: {inputs: [eia_planned_additions_mw, lead_time_turbines, utility_large_load_gw]}
  electronics_manufacturing: {inputs: [hyperscaler_capex_guidance]}
anchors: [MSFT, GOOGL, AMZN, META, ORCL, CRWV]   # hyperscaler guidance anchors (graph distance 0)

# US membership proposals (BRIEF §4.11 "US companies by industry map plus facts"). Every proposal waits for Manzoor's
# confirmation in the web app before S11 counts it. Capex-desk companies by their Appendix H seed group; other US
# companies in the ledger (with verified capex facts) by SIC code prefix.
industry_map:
  seed_groups:
    compute_semis: [compute]
    servers_ems: [compute, electronics_manufacturing]
    optical_connectivity: [optical, networking]
    storage: [compute]
    semicap: [compute]
    power_equipment: [power_equipment, grid]
    cooling_hvac: [cooling]
    onsite_power_storage: [on_site_power]
    construction: [construction, grid]
    data_center_reits: [construction]
  sic:
    "3674": [compute]                       # semiconductors
    "3571": [compute]                       # electronic computers
    "3572": [compute]                       # computer storage devices
    "3576": [networking]                    # computer communications equipment
    "3661": [networking, optical]           # telephone and telegraph apparatus
    "3663": [networking]                    # radio and TV broadcasting and communications equipment
    "3357": [optical]                       # drawing and insulating of nonferrous wire
    "3827": [optical]                       # optical instruments and lenses
    "3672": [electronics_manufacturing]     # printed circuit boards
    "3678": [electronics_manufacturing]     # electronic connectors
    "3612": [power_equipment, grid]         # power, distribution and specialty transformers
    "3613": [power_equipment, grid]         # switchgear and switchboard apparatus
    "3621": [power_equipment]               # motors and generators
    "3511": [power_equipment, on_site_power] # steam, gas and hydraulic turbines
    "3519": [on_site_power]                 # internal combustion engines
    "3585": [cooling]                       # air-conditioning and heating equipment
    "1623": [grid, construction]            # water, sewer, pipeline, communication and power line construction
    "1731": [construction]                  # electrical work
    "1711": [construction]                  # plumbing, heating and air-conditioning
# Demand inputs (§4.11): lead-time facts by equipment (subject_key lead_time:<equipment> matching the pattern).
lead_time_equipment:
  lead_time_transformers: "transformer"
  lead_time_turbines: "turbine"
  lead_time_switchgear: "switchgear"
index:
  history_weeks: 156        # each input's YoY change is z-scored against its own last 3 years of weekly YoY values
  min_history: 12           # fewer YoY observations than this: no z for that input yet
  min_spread: 0.005         # YoY values spread less than 0.5 pp: no z (a steady input isn't a signal)
  fact_max_age_days: 400    # a fact older than this no longer sets an input's level

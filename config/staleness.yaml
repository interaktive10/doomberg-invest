# BRIEF §2.7 "Staleness is visible": a source with no success for longer than its SLA reads as late, and every late or
# stale source is listed in a banner at the top of the digest (§4.12) and of the web app's Home. The brief sets the US
# weekly sources at 8 days and the India weekly ones at 10; the others follow their own cadence. Only the sources the
# pipeline still reads are listed (overhaul PR 4: Yahoo, Stooq, FRED, EIA and GDELT are gone). India is paused
# (docs/SPEC_ISSUES.md 46): its nse and bse rows come back with it.
sla_days:
  sec: 8        # US weekly (companyfacts, submissions); the daily events run refreshes it too
  twelvedata: 8 # US weekly prices (candidate set and benchmarks), the only price source (SPEC_ISSUES 37, 38)
  sec_13f: 100  # quarterly 13F data sets
# A fallback source is used only when its primary fails (BSE when NSE's bhavcopy fails), so it records a success only
# in those weeks; while its primary is within its SLA, a fallback isn't late (M6 review R2-F5). None while India is
# paused (bse: nse comes back with it).
fallback_of: {}

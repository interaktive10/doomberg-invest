# PROTECTED (BRIEF Appendix D). Context metrics C1-C4, BRIEF §4.7; US benchmarks, BRIEF §4.4.
c1:
  history_years: 10
c2_reverse_dcf:
  years: 10
  discount_rate: {us: 0.09, in: 0.12}
  terminal_growth: {us: 0.025, in: 0.045}
  margin_floor: 0.02
  margin_median_years: 5
  s2c_median_years: 5
  s2c_clip: [0.5, 4.0]
  s2c_default: 1.5
  brentq_bounds: [-0.20, 0.60]
  evidence_growth:
    w_orderbook: 0.4
    w_cagr3: 0.3
    w_latest_yoy: 0.3
    orderbook_clip: [-0.2, 0.6]
    cap: [-0.10, 0.40]
    latest_yoy_basis: ttm   # TTM revenue YoY, not the latest quarter's: lumpy quarters hit the cap (SPEC_ISSUES 43)
    orderbook_min_coverage: 0.25  # g(ob) counts only when ob/TTM(revenue) >= 0.25 (SPEC_ISSUES 42)
  growth_must_add_value: true  # C2 null when m(1 - t) x S2C <= discount: growth lowers PV there (SPEC_ISSUES 43)
  score_center: 50
  score_slope: 250          # clip(50 + 250 x C2, 0, 100)
c3_runup:
  lookback_weeks: 52
  already_ran_pct: 90
c4_attention:
  lookback_days: 90
  source: gdelt_doc_2
benchmarks:
  us: ["^spx", XLK, XLI, XLU, XLE, XLB, XLV, XLF, XLY, XLP, XLRE, XLC]
  in: ["NIFTY 50", "NIFTY 500"]

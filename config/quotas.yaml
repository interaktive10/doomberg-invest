# LLM free-tier quotas (BRIEF §2.6). Values are PER PROJECT and CHANGE: copy them from each provider's console
# (see docs/QUOTAS.md). null = not filled in yet -> the router treats that provider as unavailable.
providers:
  gemini:
    # Free tier, AI Studio 2026-10-08: flash-lite 15 RPM / 250K TPM / 500 RPD; flash 5 RPM / 250K TPM / 20 RPD.
    # One budget per provider and a 429 blocks all of Gemini until the next day, so cards use flash-lite too:
    # flash's 20 a day would run out on one week's cards and take extraction down with it.
    models: {extract: gemini-3.5-flash-lite, card: gemini-3.5-flash-lite}
    requests_per_day: 500
    requests_per_minute: 15
    tokens_per_day: null        # no daily token cap shown
  groq:
    models: {extract: llama-3.3-70b-versatile}
    requests_per_day: null
    requests_per_minute: null
    tokens_per_day: null
  openrouter:
    base_url: https://openrouter.ai/api/v1       # the ONLY base_url an OpenAI(...) client may use (guard)
    models: {extract: "meta-llama/llama-3.3-70b-instruct:free"}
    requests_per_day: null
    requests_per_minute: null
    tokens_per_day: null
routing:
  P-01: [gemini, groq, openrouter]
  P-02: [gemini, groq, openrouter]
  P-05: [gemini, groq]
  P-07: [gemini, groq, openrouter]
  P-04-fallback: [gemini]
# the text run's order, for the record (the code's is pipeline/facts/run.py ORDER; a test keeps the two the same;
# docs/SPEC_ISSUES.md 58): theses and research entries, the stage names on a board, those one verified fact would make
# a Candidate, the rest, Excluded names last
work_order: [thesis, board, one_fact, stage, excluded]
text_daily_limits:
  # about 230 P-01 calls at 1.5 a document: Gemini's 500 a day leave about 270 for P-02, P-07 and Monday's cards
  documents_per_day: 150
# GitHub Actions minutes (overhaul PR 3, pipeline/digest/minutes.py): the account's private repos share the free 2,000
# a billing cycle, and going over stops every workflow until the reset. Read from github.com/settings/billing: Manzoor
# updates cycle_day (the day the cycle resets) and other_repos (this cycle's minutes in his other private repos; 0 while
# their workflows are off). The digest prints used and projected; lab-prices.yml and lab.yml run only while
# used + their limit + reserve + the remaining scheduled runs stays at or below gate_max.
actions:
  included: 2000
  cycle_day: 1       # Manzoor: copy from github.com/settings/billing
  other_repos: 0     # extra minutes other repos are known to have used this cycle, on top of the daily rate below
  other_repos_per_day: 31  # the other private repos' rate, budgeted for every day of the cycle (this token can't read
                           # them): Oct 1-22, 2026 they used 670 (splay 325, monarch-pearl 194, murmur 125, others 26)
  gate_max: 1900
  reserve: 180       # minutes no schedule shows: CI, thesis-ingest, a re-run
  warn_above: 1600   # the digest's warning
  typical:           # billed minutes of one scheduled run (each job rounded up), for the projection
    daily.yml: 35            # SEC then text, about 20, 35 on a slow day (docs/SPEC_ISSUES.md 58); India about 12
    weekly.yml: 140          # us about 5, India up to 80, scores about 50 (400 prices 8 s apart), publish about 5
    quarterly.yml: 60        # §2.5's target
    thesis-fallback.yml: 12  # writes the week's cards while no routine does (SPEC_ISSUES 60); 2 when the routine did
    lab-prices.yml: 0        # gated: each run asks for its own 120 minutes
    india-backfill.yml: 0    # gated: each run asks for its own 345 minutes (once, about two days: SPEC_ISSUES 55)
  download_run: 95   # one lab-prices.yml run (its 90 minutes + setup): the digest projects only the runs the Lab
                     # download still needs (its pending tickers, 650 a run); the gate leaves them out

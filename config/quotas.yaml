# LLM free-tier quotas (BRIEF §2.6). Values are PER PROJECT and CHANGE: copy them from each provider's console
# (see docs/QUOTAS.md). null = not filled in yet -> the router treats that provider as unavailable.
providers:
  gemini:
    # Free tier, AI Studio 2026-10-08: flash-lite 15 RPM / 250K TPM / 500 RPD; flash 5 RPM / 250K TPM / 20 RPD.
    # One budget per provider and a 429 blocks all of Gemini until the next day, so cards use flash-lite too:
    # flash's 20 a day would run out on one week's cards and take extraction down with it.
    models: {extract: gemini-3.5-flash-lite, card: gemini-3.5-flash-lite}
    requests_per_day: 500
    requests_per_minute: 15
    tokens_per_day: null        # no daily token cap shown
  groq:
    models: {extract: llama-3.3-70b-versatile}
    requests_per_day: null
    requests_per_minute: null
    tokens_per_day: null
  openrouter:
    base_url: https://openrouter.ai/api/v1       # the ONLY base_url an OpenAI(...) client may use (guard)
    models: {extract: "meta-llama/llama-3.3-70b-instruct:free"}
    requests_per_day: null
    requests_per_minute: null
    tokens_per_day: null
routing:
  P-01: [gemini, groq, openrouter]
  P-02: [gemini, groq, openrouter]
  P-03: [gemini, groq, openrouter]
  P-05: [gemini, groq]
  P-06: [gemini, groq, openrouter]
  P-07: [gemini, groq, openrouter]
  P-04-fallback: [gemini]
work_order: [capex_desk, candidate_shortlist, other]
text_daily_limits:
  documents_per_day: null
